name: Run Content Factory & Test Suite

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح لك تشغيل الوركفلو يدوياً عند الحاجة

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. إعداد بيئة Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-style: '3.10'

      # 3. تثبيت المكتبات والتعديلات المطلوبة
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. تشغيل الاختبارات البرمجية (Unit Tests)
      - name: Run Test Suite
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_API_KEY: ${{ secrets.MAKE_WEBHOOK_API_KEY }}
        run: |
          python -m unittest discover -s . -p "test_*.py"

      # 5. تشغيل السكربت الرئيسي لإرسال المحتوى إلى Make.com
      - name: Execute Main Script
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          MAKE_WEBHOOK_API_KEY: ${{ secrets.MAKE_WEBHOOK_API_KEY }}
        run: |
          python main.py
