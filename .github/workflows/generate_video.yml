name: Quran Cinematic AI Factory

on:
  schedule:
    # GitHub may delay scheduled runs. The application also enforces one auto run per Casablanca date.
    - cron: '17 12 * * *'
      timezone: 'Africa/Casablanca'
  workflow_dispatch:
    inputs:
      mode:
        description: 'طريقة اختيار الموضوع'
        type: choice
        required: true
        default: auto
        options:
          - auto
          - manual
      topic:
        description: 'معرّف الموضوع من data/topics.json عند اختيار manual'
        type: string
        required: false
      reprocess:
        description: 'السماح بإعادة إنشاء فيديو موضوع سبق إنتاجه (لا يكرر وجهة منشورة)'
        type: boolean
        required: false
        default: false

concurrency:
  group: quran-cinematic-ai-factory
  cancel-in-progress: false
  queue: max

permissions:
  # Persist data/production_history.json between scheduled runs, and create the GitHub Release
  # that hosts the public video link sent to Make.com.
  contents: write

jobs:
  produce:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Africa/Casablanca
      DAILY_VIDEO_COUNT: ${{ vars.DAILY_VIDEO_COUNT || '1' }}
      VIDEO_WIDTH: ${{ vars.VIDEO_WIDTH || '1080' }}
      VIDEO_HEIGHT: ${{ vars.VIDEO_HEIGHT || '1920' }}
      VIDEO_FPS: ${{ vars.VIDEO_FPS || '24' }}
      VIDEO_DIM_STRENGTH: ${{ vars.VIDEO_DIM_STRENGTH || '0.30' }}
      TARGET_MIN_DURATION: ${{ vars.TARGET_MIN_DURATION || '45' }}
      TARGET_MAX_DURATION: ${{ vars.TARGET_MAX_DURATION || '60' }}
      MAX_CANDIDATES_PER_RUN: ${{ vars.MAX_CANDIDATES_PER_RUN || '5' }}
      MAX_RETRIES: ${{ vars.MAX_RETRIES || '3' }}
      # The idea comes first: topics (question + vetted facts + the verses used as evidence) live in this file.
      TOPICS_FILE: ${{ vars.TOPICS_FILE || 'data/topics.json' }}
      # Automatic runs skip a topic whose recitations together exceed MAX_RECITATION_SECONDS.
      MAX_RECITATION_SECONDS: ${{ vars.MAX_RECITATION_SECONDS || '45' }}
      # Subtitle-style captions (4-5 words at a time) or the old big cards: captions | card.
      COMMENTARY_STYLE: ${{ vars.COMMENTARY_STYLE || 'captions' }}
      # Commentary voice: edge (default) | gemini | auto (Gemini first, edge-tts as fallback).
      TTS_PROVIDER: ${{ vars.TTS_PROVIDER || 'edge' }}
      TTS_VOICE: ${{ vars.TTS_VOICE || 'ar-EG-ShakirNeural' }}
      GEMINI_API_KEY1: ${{ secrets.GEMINI_API_KEY1 }}
      GEMINI_TTS_MODEL: ${{ vars.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE: ${{ vars.GEMINI_TTS_VOICE }}
      GEMINI_TTS_STYLE: ${{ vars.GEMINI_TTS_STYLE }}
      GEMINI_TTS_TERMS_URL: ${{ vars.GEMINI_TTS_TERMS_URL }}
      ARABIC_FONT: ${{ vars.ARABIC_FONT }}
      ARABIC_FONT_LICENSE_URL: ${{ vars.ARABIC_FONT_LICENSE_URL }}
      ARABIC_FONT_LICENSE_CONFIRMED: ${{ vars.ARABIC_FONT_LICENSE_CONFIRMED }}
      # Scene pictures: free generation (Cloudflare Workers AI), a new picture about every 3 seconds.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IMAGE_PROVIDERS: ${{ vars.IMAGE_PROVIDERS || 'cloudflare' }}
      IMAGE_GEN_LICENSE_CONFIRMED: ${{ vars.IMAGE_GEN_LICENSE_CONFIRMED }}
      IMAGE_GEN_LICENSE_URL: ${{ vars.IMAGE_GEN_LICENSE_URL }}
      CF_IMAGE_MODEL: ${{ vars.CF_IMAGE_MODEL }}
      CF_IMAGE_SIZE_PARAMS: ${{ vars.CF_IMAGE_SIZE_PARAMS }}
      MAX_SCENE_IMAGES: ${{ vars.MAX_SCENE_IMAGES || '14' }}
      VISUAL_ASSETS_LICENSE_CONFIRMED: ${{ vars.VISUAL_ASSETS_LICENSE_CONFIRMED }}
      VISUAL_ASSETS_LICENSE_URL: ${{ vars.VISUAL_ASSETS_LICENSE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
      QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
      QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      QF_ENV: ${{ vars.QF_ENV || 'production' }}
      QURAN_ATTRIBUTION: ${{ vars.QURAN_ATTRIBUTION }}
      QURAN_TEXT_LICENSE_URL: ${{ vars.QURAN_TEXT_LICENSE_URL }}
      QURAN_TEXT_LICENSE_CONFIRMED: ${{ vars.QURAN_TEXT_LICENSE_CONFIRMED }}
      CHAPTER_RECITER_ID: ${{ vars.CHAPTER_RECITER_ID }}
      RECITATION_ALLOWLIST: ${{ vars.RECITATION_ALLOWLIST }}
      RECITATION_REQUIRE_MISHARY: ${{ vars.RECITATION_REQUIRE_MISHARY || 'true' }}
      RECITATION_LICENSE_CONFIRMED: ${{ vars.RECITATION_LICENSE_CONFIRMED }}
      RECITATION_LICENSE_URL: ${{ vars.RECITATION_LICENSE_URL }}
      RECITATION_ATTRIBUTION: ${{ vars.RECITATION_ATTRIBUTION }}
      TAFSIR_ID: ${{ vars.TAFSIR_ID }}
      TAFSIR_ALLOWLIST: ${{ vars.TAFSIR_ALLOWLIST }}
      TAFSIR_COMMERCIAL_LICENSE_VERIFIED: ${{ vars.TAFSIR_COMMERCIAL_LICENSE_VERIFIED }}
      TAFSIR_LICENSE_URL: ${{ vars.TAFSIR_LICENSE_URL }}
      TAFSIR_ATTRIBUTION: ${{ vars.TAFSIR_ATTRIBUTION }}
      TTS_TERMS_CONFIRMED: ${{ vars.TTS_TERMS_CONFIRMED }}
      TTS_LICENSE_URL: ${{ vars.TTS_LICENSE_URL }}
      TTS_ATTRIBUTION: ${{ vars.TTS_ATTRIBUTION }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PUBLISH_ENABLED: ${{ vars.META_PUBLISH_ENABLED || 'false' }}
      META_REELS_DISCLOSURE_CONFIRMED: ${{ vars.META_REELS_DISCLOSURE_CONFIRMED }}
      META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION || 'v26.0' }}
      # Make.com: the video is uploaded to a public GitHub Release, then its link is sent to the
      # webhook, which fans out to Facebook, YouTube, Instagram and TikTok. When enabled it replaces
      # the direct YouTube/Facebook publishers. The webhook URL is a secret because the repository is public.
      MAKE_PUBLISH_ENABLED: ${{ vars.MAKE_PUBLISH_ENABLED || 'false' }}
      MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
      MAKE_WEBHOOK_API_KEY: ${{ secrets.MAKE_WEBHOOK_API_KEY }}
      MAKE_PLATFORMS: ${{ vars.MAKE_PLATFORMS || 'facebook,youtube,instagram,tiktok' }}
      GITHUB_TOKEN: ${{ github.token }}
      MODE: ${{ inputs.mode || 'auto' }}
      MANUAL_TOPIC: ${{ inputs.topic }}
      REPROCESS: ${{ inputs.reprocess || 'false' }}
      OUTPUT_DIR: output
      HISTORY_FILE: data/production_history.json
      FINAL_VIDEO_NAME: final_output.mp4
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and Arabic fonts
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fontconfig fonts-noto-core libcairo2
          command -v ffmpeg
          command -v ffprobe
          fc-match 'Noto Naskh Arabic' -f '%{file}\n'
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
          python -c "import requests, PIL, arabic_reshaper, bidi, edge_tts; from google import genai; from googleapiclient.discovery import build; print('Python dependencies import successfully')"
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow RAQM support is required for Arabic shaping'; print('Pillow RAQM available')"

      - name: Run offline unit tests
        run: |
          python topics.py
          python scene_images.py
          python procedural_background.py
          python services.py
          python video_engine.py
          python main.py --test

      - name: Generate, validate, and publish
        run: |
          args=(--mode "$MODE")
          if [[ "$MODE" == "manual" ]]; then
            [[ -n "$MANUAL_TOPIC" ]] || { echo 'manual mode requires a topic id (see data/topics.json)' >&2; exit 2; }
            args+=(--topic "$MANUAL_TOPIC")
          fi
          if [[ "$REPROCESS" == "true" ]]; then args+=(--reprocess); fi
          python main.py "${args[@]}"

      - name: Commit permanent production history without overwriting newer data
        if: always() && hashFiles('data/production_history.json') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/production_history.json
          if git diff --cached --quiet; then
            echo 'Production history has no changes.'
            exit 0
          fi
          git commit -m "Update permanent production history"
          git fetch origin "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Upload video and diagnostic reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quran-video-${{ github.run_id }}
          path: |
            output/final_output.mp4
            output/reports/*.json
          if-no-files-found: warn
          retention-days: 30
